<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>AI Skin Disease Detector</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image"></script>
  </head>
  <body>
    <h1>AI Skin Disease Detector</h1>
    <input type="file" id="upload" accept="image/*" onchange="predict()">
    <pre id="result"></pre>

    <script>
      const modelURL = "YOUR_MODEL_URL/model.json";
      const metadataURL = "YOUR_MODEL_URL/metadata.json";
      let model;

      async function loadModel() {
        model = await tmImage.load(modelURL, metadataURL);
        console.log("Model loaded!");
      }
      loadModel();

      async function predict() {
        const file = document.getElementById("upload").files[0];
        const image = document.createElement("img");
        image.src = URL.createObjectURL(file);
        await image.decode();
        const prediction = await model.predict(image);
        document.getElementById("result").textContent =
          JSON.stringify(prediction, null, 2);
      }
    </script>
  </body>
</html>
